  </head><body class="bg-surface font-body-md text-on-surface antialiased flex flex-col min-h-screen"><main class="flex flex-col relative w-full bg-surface min-h-screen"><div class="flex flex-col w-full relative select-none">

<div class="z-50 px-margin pt-2 pb-1 flex justify-center">
<div class="flex items-center gap-1 p-1 rounded-full bg-inverse-surface/85 backdrop-blur-md shadow-sm">
<button class="px-3 py-1 rounded-full font-label-sm text-label-sm transition-all duration-200 bg-surface-container-highest/30 text-inverse-on-surface font-medium" id="toggle-state-a" onclick="switchState('normal')" type="button">
        Görüntüleme
      </button>
<button class="px-3 py-1 rounded-full font-label-sm text-label-sm transition-all duration-200 text-inverse-on-surface/60 hover:text-inverse-on-surface" id="toggle-state-b" onclick="switchState('error')" type="button">
        Fotoğraf Bulunamadı
      </button>
</div>
</div>
<!-- Main Canvas Container -->
<div class="relative w-full aspect-[9/18] max-h-[820px] bg-[#0d0e0d] overflow-hidden flex flex-col justify-between">
<!-- Top Bar: Subtle Floating Gradient Scrim -->

<button aria-label="Geri git" class="flex items-center justify-center w-10 h-10 -ml-2 rounded-full active:bg-white/10 transition-colors" type="button">
<span class="material-symbols-outlined text-[24px] text-white">arrow_back</span>
</button>
<div class="flex flex-col min-w-0">

<!-- Discreet Ambient Center Vignette & Natural Touch Horizon -->

</div>

<div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-black/60 backdrop-blur-md text-white/75 shadow-sm">

          </span>
</div>
</footer>
</section>
<!-- STATE B: Photo Not Found / Moved Canvas -->
<section class="hidden absolute inset-0 z-20 flex-col items-center justify-center px-space-lg text-center bg-[#0d0e0d]" id="view-error">

<div class="flex items-center justify-center w-16 h-16 rounded-full bg-white/5 mb-4">

</div>
<h2 class="font-title-md text-title-md text-white/90 mb-1">
          Fotoğraf bulunamadı
        </h2>
<p class="font-body-sm text-body-sm text-white/60 leading-relaxed mb-6">
          Dosya cihazdan silinmiş veya yeri değiştirilmiş olabilir.
        </p>
<button class="font-label-lg text-label-lg text-white/80 underline underline-offset-4 hover:text-white transition-colors py-2 px-4 rounded-lg active:bg-white/5" onclick="switchState('normal')" type="button">
          Geri dön
        </button>
</div>
</section>
</div>
</div>
<script>
  function switchState(state) {
    const viewNormal = document.getElementById('view-normal');
    const viewError = document.getElementById('view-error');
    const btnA = document.getElementById('toggle-state-a');
    const btnB = document.getElementById('toggle-state-b');

    if (state === 'normal') {
      viewNormal.classList.remove('hidden');
      viewNormal.classList.add('flex');
      viewError.classList.add('hidden');
      viewError.classList.remove('flex');

      btnA.className = "px-3 py-1 rounded-full font-label-sm text-label-sm transition-all duration-200 bg-surface-container-highest/30 text-inverse-on-surface font-medium";
      btnB.className = "px-3 py-1 rounded-full font-label-sm text-label-sm transition-all duration-200 text-inverse-on-surface/60 hover:text-inverse-on-surface";
    } else {
      viewNormal.classList.add('hidden');
      viewNormal.classList.remove('flex');
      viewError.classList.remove('hidden');
      viewError.classList.add('flex');

      btnB.className = "px-3 py-1 rounded-full font-label-sm text-label-sm transition-all duration-200 bg-surface-container-highest/30 text-inverse-on-surface font-medium";
      btnA.className = "px-3 py-1 rounded-full font-label-sm text-label-sm transition-all duration-200 text-inverse-on-surface/60 hover:text-inverse-on-surface";
    }
  }
</script></main><div class="fixed bottom-0 w-full z-50 pb-safe pointer-events-none"><div class="flex justify-center pb-2 pt-1"><div class="w-28 h-1 bg-on-surface/20 rounded-full"></div></div></div></body></html>
