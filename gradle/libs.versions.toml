# Bağımlılık gerekçeleri (architecture.md Bölüm 8: bağımlılık eklenmeden gerekçe belirtilir).
# Tüm bağımlılıklar cihaz üstü çalışır; ağ/analitik/crash SDK'sı yoktur.
# Gradle wrapper: 9.3.1 (JDK 24 ile uyumlu; gradle/wrapper/gradle-wrapper.properties, sha256 doğrulamalı).

[versions]
# Android Gradle Plugin 9.1: JDK 24 ve Gradle 9.3 ile uyumlu, Kotlin desteği yerleşik.
agp = "9.1.0"
# Kotlin: AGP 9.1'in yerleşik Kotlin sürümü; Compose compiler eklentisi aynı sürümde olmalı.
kotlin = "2.2.10"
# KSP: Room derleyicisi için (kapt yerine). 2.3.x Kotlin sürümünden bağımsız.
ksp = "2.3.12"
# Room: SQLite üzerinde cihaz üstü indeks (architecture.md Bölüm 3, 5).
room = "2.8.5"
# Compose BOM: UI araç seti (architecture.md Bölüm 3). Geri çekildi: 2026.09 (Compose 1.12) ve
# core-ktx 1.19 compileSdk 37 ister; AGP 9.1 en fazla 36 önerir ve SDK 37 kurulu değil.
# compileSdk/targetSdk 36 ile uyumlu en yeni çift: BOM 2026.02.01 + core-ktx 1.17.0.
composeBom = "2026.02.01"
coreKtx = "1.17.0"
# Activity Compose: ComponentActivity.setContent ve enableEdgeToEdge için.
activityCompose = "1.12.4"
# Navigation Compose: arama / büyük görünüm / indeks durumu ekranları arası geçiş ve geri yığını (T-009).
# 2.9.x compileSdk 36 ile uyumlu; ağ veya analitik bileşeni içermez.
navigationCompose = "2.9.7"
# Lifecycle Runtime Compose: collectAsStateWithLifecycle (arka plandayken Flow toplamayı durdurur).
# 2.9.4 zaten navigation/activity üzerinden çözülen sürümdür; yeni sürüm çekilmez.
lifecycle = "2.9.4"
# Coil 3: MediaStore content:// URI'lerinden boyuta uygun decode, EXIF yönü, bellek önbelleği (T-009).
# YALNIZCA ağsız artefakt (coil-compose -> coil, coil-core); coil-network-*, okhttp ve ktor EKLENMEZ,
# bu yüzden http(s) yükleme yeteneği yoktur. 3.5.0: compileSdk 36 ile uyumlu en yeni sürüm (3.6.x compileSdk 37 ister).
coil = "3.4.0"
# Test bağımlılıkları.
junit = "4.13.2"
androidxTestExtJunit = "1.3.0"
androidxTestRunner = "1.7.0"
# Coroutines test: Flow/suspend birim testleri için.
coroutines = "1.11.0"

[libraries]
# Uygulama: temel Kotlin uzantıları ve Compose girişi.
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# Navigation Compose: NavHost/rota/geri yığını (T-009). Kendi basit yığınımızı yazmak yerine standart çözüm.
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
# Coil Compose: AsyncImage. Ağ artefaktı yok (bkz. coil sürüm yorumu); `:app:dependencies` ile okhttp/ktor yok doğrulandı.
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
# Lifecycle'a duyarlı StateFlow toplama (collectAsStateWithLifecycle).
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
# Compose UI testi (androidTest, T-009): stateless ekranların derlenebilir/çalıştırılabilir testi; sürüm BOM'dan.
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
# Yalnızca debug: ui-test-junit4'ün ComponentActivity'yi bildiren manifesti.
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
# Yalnızca debug: Layout Inspector / tooling desteği.
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
# Room: runtime + ktx (coroutine/Flow desteği) + KSP derleyicisi. Entity/DAO T-002 ve sonrasında.
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
# Henüz kullanılmıyor, T-002 ve sonrası için: Room cihaz/migration testleri (androidTest).
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
# Coroutines core: domain arayüzlerindeki Flow (IndexProgress) için; test kütüphanesiyle aynı sürüm.
# Zaten Room/Activity üzerinden geçişli geliyor, ancak domain API'si doğrudan kullandığı için açıkça bildirildi.
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
# Birim testi.
junit = { group = "junit", name = "junit", version.ref = "junit" }
# Flow/suspend birim testleri (runTest); domain sözleşme testlerinde kullanılıyor.
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
# Henüz kullanılmıyor, T-002 ve sonrası için: cihaz testi (androidTest) altyapısı.
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
